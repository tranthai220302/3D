<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phòng 3D</title>
    <style>
      :root { --bg:#0e0b1f; --panel:#1a1535; --line:#3a2f6b; --text:#ece8ff; --muted:#9c93c9; --accent:#ff7ab8; }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
      .center { min-height:100vh; display:grid; place-items:center; padding:20px; }
      .card { width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px; }
      h1 { font-size:26px; margin:0 0 6px; }
      p.sub { color:var(--muted); margin:0 0 22px; font-size:14px; }
      label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
      input { width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line); background:#120e2a; color:var(--text); font-size:15px; }
      input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
      button { cursor:pointer; font-size:15px; }
      .primary { width:100%; margin-top:22px; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#2a0b1d; font-weight:600; }
      .primary:disabled { opacity:.6; cursor:wait; }
      .link { background:none; border:0; color:var(--accent); padding:0; text-decoration:underline; }
      .switch { margin-top:18px; font-size:14px; color:var(--muted); text-align:center; }
      .err { color:#ff9aa8; font-size:14px; margin-top:14px; min-height:18px; }
      .bar { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:14px 20px; z-index:2; pointer-events:none; }
      .bar > * { pointer-events:auto; }
      .out { padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:rgba(26,21,53,.8); color:var(--text); }
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
